<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-color);
            font-family: var(--font-family);
            text-align: center;
        }
        .error-container {
            max-width: 500px;
            padding: 4rem 3rem;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .error-container h1 {
            font-size: 6rem;
            margin: 0;
            color: var(--accent-color);
            line-height: 1;
            display: none; /* Replaced by SVG */
        }
        
        /* SVG Animation Styles */
        .error-svg {
            display: block;
            margin: 0 auto 1.5rem;
            max-width: 100%;
            height: auto;
        }
        .animated-cup {
            animation: floatCup 3s ease-in-out infinite;
        }
        .steam {
            opacity: 0;
        }
        .steam-1 {
            animation: riseSteam 2.5s infinite ease-in;
        }
        .steam-2 {
            animation: riseSteam 2.5s infinite ease-in 1.25s;
        }

        @keyframes floatCup {
            0%, 100% { transform: translate(120px, 60px); }
            50% { transform: translate(120px, 50px); }
        }

        @keyframes riseSteam {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
        }
        .error-container h2 {
            font-size: 2rem;
            margin: 1rem 0;
            color: var(--primary-color);
        }
        .error-container p {
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .btn-home {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            border: 2px solid var(--accent-color);
        }
        .btn-home:hover {
            background: var(--accent-color-hover);
            border-color: var(--accent-color-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .btn-back {
            display: inline-block;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            border: 2px solid var(--primary-color);
            transition: var(--transition);
        }
        .btn-back:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="error-container">
        <!-- Animated 404 SVG -->
        <svg width="240" height="120" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg" class="error-svg">
            <!-- Number 4 -->
            <text x="40" y="100" font-family="Outfit, sans-serif" font-size="100" font-weight="700" fill="var(--accent-color)">4</text>
            
            <!-- Coffee Cup (The '0') -->
            <g class="animated-cup" transform="translate(120, 60)">
                <!-- Steam -->
                <path d="M-8,-30 Q-3,-40 -8,-50" fill="none" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" class="steam steam-1"/>
                <path d="M8,-25 Q13,-35 8,-45" fill="none" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" class="steam steam-2"/>
                <!-- Cup Body -->
                <path d="M-25,-15 L25,-15 C25,15 15,30 0,30 C-15,30 -25,15 -25,-15 Z" fill="var(--accent-color)"/>
                <!-- Handle -->
                <path d="M23,-5 C38,-5 38,15 20,15" fill="none" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round"/>
                <!-- Saucer -->
                <ellipse cx="0" cy="35" rx="35" ry="6" fill="var(--primary-color)"/>
            </g>

            <!-- Number 4 -->
            <text x="160" y="100" font-family="Outfit, sans-serif" font-size="100" font-weight="700" fill="var(--accent-color)">4</text>
        </svg>
        <h2>Oops! Page Not Found</h2>
        <p>The page or feature you are looking for doesn't exist or is still under construction. Don't worry, even the best explorers get lost sometimes!</p>
        <div class="btn-container">
            <button onclick="window.history.back()" class="btn-back">Go Back</button>
            <a href="index.html" class="btn-home">Return to Home</a>
        </div>
    </div>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>
</html>
